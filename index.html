<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas Trading Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="rose" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1" />
          <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="0.6" stroke-dasharray="1 2" />
          <path d="M16 2 L18.2 16 L16 30 L13.8 16 Z" fill="currentColor" />
          <path d="M2 16 L16 13.8 L30 16 L16 18.2 Z" fill="currentColor" opacity="0.45" />
        </svg>
        <span class="wordmark">Atlas</span>
        <span class="sub">Trading Desk</span>
      </div>
      <nav class="tabs" role="tablist">
        <button data-view="sim" class="active" role="tab">Simulator</button>
        <button data-view="lessons" role="tab">Lessons &amp; Progress</button>
      </nav>
      <div class="top-right">
        <span id="level-badge" class="level-badge"></span>
        <button id="theme-toggle" class="icon-btn" title="Toggle night chart" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main id="view-sim" class="sim">
      <aside class="desk">
        <div class="seg desk-tabs">
          <button data-desk="scenario" class="active">Scenario</button>
          <button data-desk="today">Today's Market</button>
        </div>
        <section id="desk-scenario" class="stack">
          <div id="briefing" class="card"></div>
          <div id="context" class="card"></div>
          <div class="card">
            <h3>The Wire</h3>
            <ol id="wire" class="wire"><li class="muted">Headlines appear here as the round plays.</li></ol>
          </div>
        </section>
        <section id="desk-today" class="stack" hidden></section>
      </aside>

      <section class="chart-col">
        <div class="chart-head">
          <div class="instrument">
            <div class="inst-name" id="inst-name">Loading…</div>
            <div class="inst-meta" id="inst-meta"></div>
          </div>
          <div class="quote">
            <div class="price num" id="price">—</div>
            <div class="change num" id="change"></div>
          </div>
        </div>
        <div class="controls">
          <div class="seg" id="mode-seg">
            <button data-mode="daily" class="active">1Y · 1D</button>
            <button data-mode="intraday">5D · 5m</button>
          </div>
          <button id="new-round" class="btn ghost">New round</button>
          <span class="divider"></span>
          <button id="play" class="btn primary" title="Space">Start</button>
          <button id="step" class="btn ghost" title="→ steps one bar">Step ›</button>
          <div class="seg" id="speed-seg" title="Bars per second (keys 1–5)">
            <button data-speed="0.5">½×</button>
            <button data-speed="1">1×</button>
            <button data-speed="2" class="active">2×</button>
            <button data-speed="4">4×</button>
            <button data-speed="8">8×</button>
          </div>
          <span class="divider"></span>
          <div class="seg" id="tool-seg" title="Drawing tools">
            <button data-tool="level" title="Click the chart to draw a horizontal level (L)">― Level</button>
            <button data-tool="swing" title="Click a candle to mark a swing high or low (H)">⌃ Swing</button>
          </div>
          <button id="clear-marks" class="btn ghost small">Clear marks</button>
        </div>
        <div class="progress"><div id="progress-bar"></div><span id="clock" class="clock"></span></div>
        <div class="chart-wrap">
          <div id="phase-banner" class="phase-banner"></div>
          <div id="chart-main" class="chart-main"></div>
          <div id="chart-macd" class="chart-macd"></div>
        </div>
        <div class="legend" id="legend">
          <label><input type="checkbox" data-overlay="sma8" checked /><i class="sw gold"></i>SMA 8</label>
          <label><input type="checkbox" data-overlay="sma25" checked /><i class="sw accent"></i>SMA 25</label>
          <label><input type="checkbox" data-overlay="sma50" checked /><i class="sw plum"></i>SMA 50</label>
          <label><input type="checkbox" data-overlay="bb" checked /><i class="sw band dashed"></i>Bollinger 20, 2</label>
          <label><input type="checkbox" data-overlay="volume" checked /><i class="sw vol"></i>Volume</label>
          <label><input type="checkbox" data-overlay="macd" checked /><i class="sw accent"></i>MACD 12, 26, 9</label>
          <span class="keys">Space play · → step · B buy · S short · X close · L level · H swing</span>
        </div>
      </section>

      <aside class="ticket">
        <div id="account" class="card"></div>
        <div id="order" class="card"></div>
        <div class="card">
          <h3>Journal</h3>
          <ol id="journal" class="journal"><li class="muted">No trades yet.</li></ol>
        </div>
      </aside>
    </main>

    <main id="view-lessons" class="lessons" hidden></main>

    <div id="debrief" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="debrief-title"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
